<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>  
        <h2>Registration Form</h2>
        <label>First name: </label>
        <input type="text" value="ms/mrs" readonly/><br>

        <label>Middle name:</label>
        <input type="text" placeholder="Middle Name"/><br>

        <label>Last name:</label>
        <input type="text"/><br>

        <label>Mobile number:</label>
        <input type ="number"/><br>

        <label>DOB:</label>
        <input type="date"/><br>

        <label>Email:</label>
        <input type="email"/><br>

        <label>Password:</label>
        <input type="password" minlength="6" maxlength="9"required/><br>

        <label>Password Confirmation:</label>
        <input type="password"/><br>

        <label>Gender:</label>
        <input type = "radio" name = "gender" value = "male"/>Male
        <input type = "radio" name = "gender" value = "female"/>Female<br>

        <label>City:</label>
        <Select>
            <option>--select--</option>
            <option>Hyderabad</option>
            <option>Chennai</option>    
            <option>Banglore</option>
        </Select>

        <label>State:</label>
        <Select>
            <option>--select--</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
            <option>Tamilnadu</option>    
            <option>Karnataka</option>
        </Select>

        <label>Address:-</label>
        <textarea></textarea><br>


        <input type = "file" name = "file"/><br>
        T&C:- <input type = "checkbox"/>I agree to the terms and conditions<br>

        <!for input type = button then the page does not refresh but for input type = submit then the page refreshes. <br>
        <button>Register</button>
        <input type = "submit"/><br>

    </form><br>

    <form>
        <fieldset>
            <legend>Personal Information</legend>
        <label>First name: </label>
        <input type="text" placeholder=""/><br>

        <label>Middle name:</label>
        <input type="text"/><br>

        <label>Last name:</label>
        <input type="text"/><br>

        </fieldset>
    </form>

</body>
</html>
